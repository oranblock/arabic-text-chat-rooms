name: Android CI (build + emulator test)

# Public, self-contained CI. Anyone can open Actions and run it. It builds the
# debug APK, starts an EPHEMERAL chat server on the runner, boots an emulator,
# maps the emulator's localhost:3001 to that server with `adb reverse`, then
# installs the APK, launches every exported activity, screenshots each, and
# reports to Telegram.
#
# Why a server in the job: the emulator's localhost is the emulator, not the
# runner. `node server.js` runs on the runner host and `adb reverse tcp:3001`
# forwards the app's existing SERVER_URL (http://localhost:3001) to it. Nothing
# is deployed or exposed; the server dies with the job.
#
# Mirrors oranblock/Android-test-harness rules:
#   - emulator action runs each script LINE as its own `sh -c`, so `script:` is
#     ONE line invoking a checked-in bash file (.github/ci/flow.sh)
#   - the flow runs under `set -uo pipefail`, never `-e` (probes return non-zero)
#   - assert the package is installed before driving it
#   - debug APK on purpose: no keystore, no signing secret

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Emulator API level
        default: "34"
      flow:
        description: "smoke | diagnose"
        default: smoke
  push:
    branches: [main]
    paths: ["android_app/**", ".github/**", "server/**"]

concurrency:
  group: android-ci-${{ github.ref }}-${{ github.event.inputs.api_level }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: android_app
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk
      - name: Verify Live VPS Server connectivity
        run: |
          echo "Testing connectivity to live VPS at http://192.236.249.134:3000..."
          curl -sf http://192.236.249.134:3000/health || (echo "VPS unreachable" && exit 1)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator flow
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PACKAGE: com.ali.textchat
          FLOW: ${{ github.event.inputs.flow || 'smoke' }}
          ACTIVITIES: com.ali.textchat/.MainActivity
          APK_DIR: apk
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          api-level: ${{ github.event.inputs.api_level || 34 }}
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # ONE line on purpose — see header. The bash lives in the file.
          script: bash .github/ci/flow.sh
      - name: VPS server status
        if: always()
        run: curl -s http://192.236.249.134:3000/health || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/**
          if-no-files-found: warn
